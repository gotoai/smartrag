# Smart RAG's embedding provider catalog.
#
# A kb's config names a provider and one of its models; everything else comes from here.
# Fixed per provider: the URL (except gotoai and custom), the authentication, the dialect
# and the request limits. Prices are USD per 1M input tokens.
#
# Providers: gotoai, voyage_ai, openai, google_gemini, cohere, mistral, custom. 
# Values marked VERIFY are settled by live API calls before the entry is final.


gotoai:
  title: GotoAI
  base_url_env: GOTOAI_EMBED_BASE_URL
  api_key_env: GOTOAI_EMBED_API_KEY
  dialect:
    wire: openai
    auth: bearer
    # The router applies each profile's own prompts for input_type.
    marking: {kind: field, field: input_type, query: query, document: document}
  # The endpoint (OumiGo) sets no per-request cap; this is Smart RAG's own batch_size bound.
  max_inputs: 2048
  data_terms: Text goes only to the GotoAI endpoint you configure, GotoAI's or your own OumiGo deployment.
  # GotoAI serves byte-identical mirrors of the vendors' repos; the vector space keeps the
  # vendor's id, so the vectors are the same as the vendor model's.
  models:
    ruri-v3-310m@8k:
      canonical_name: GotoAI-Inc/ruri-v3-310m-mirror
      compatibility_id: cl-nagoya/ruri-v3-310m
      dimensions: 768
      max_input_tokens: 8192
    harrier-oss-v1-0.6b@8k:
      canonical_name: GotoAI-Inc/harrier-oss-v1-0.6b-mirror
      compatibility_id: microsoft/harrier-oss-v1-0.6b
      dimensions: 1024
      max_input_tokens: 8192
    harrier-oss-v1-0.6b@32k:
      canonical_name: GotoAI-Inc/harrier-oss-v1-0.6b-mirror
      compatibility_id: microsoft/harrier-oss-v1-0.6b
      dimensions: 1024
      max_input_tokens: 32768

voyage_ai:
  title: Voyage AI
  base_url: https://api.voyageai.com/v1
  api_key_env: VOYAGE_API_KEY
  key_required: true
  dialect:
    wire: openai
    auth: bearer
    marking: {kind: field, field: input_type, query: query, document: document}
    dimensions_field: output_dimension  # VERIFY
  max_inputs: 1000
  data_terms: >-
    Uses API data for training by default; opting out needs a payment method and an
    org admin (https://docs.voyageai.com/docs/faq).
  models:
    voyage-4:
      canonical_name: '@voyageai/voyage-4'
      compatibility_id: '@voyageai/voyage-4-suite'
      dimensions: 1024
      allowed_dimensions: [256, 512, 1024, 2048]
      max_input_tokens: 32000
      max_request_tokens: 320000
      price: 0.06
    voyage-4-lite:
      canonical_name: '@voyageai/voyage-4-lite'
      compatibility_id: '@voyageai/voyage-4-suite'
      dimensions: 1024
      allowed_dimensions: [256, 512, 1024, 2048]
      max_input_tokens: 32000
      max_request_tokens: 1000000
      price: 0.02
    voyage-4-large:
      canonical_name: '@voyageai/voyage-4-large'
      compatibility_id: '@voyageai/voyage-4-suite'
      dimensions: 1024
      allowed_dimensions: [256, 512, 1024, 2048]
      max_input_tokens: 32000
      max_request_tokens: 120000
      price: 0.12

openai:
  title: OpenAI
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY
  key_required: true
  dialect:
    wire: openai
    auth: bearer
    marking: {kind: none}
    dimensions_field: dimensions
  max_inputs: 2048
  max_request_tokens: 300000
  data_terms: >-
    API data is not used for training
    (https://developers.openai.com/api/docs/guides/your-data).
  models:
    text-embedding-3-small:
      canonical_name: '@openai/text-embedding-3-small'
      dimensions: 1536
      dimension_range: [1, 1536]
      max_input_tokens: 8191
      price: 0.02
    text-embedding-3-large:
      canonical_name: '@openai/text-embedding-3-large'
      dimensions: 3072
      dimension_range: [1, 3072]
      max_input_tokens: 8191
      price: 0.13

google_gemini:
  title: Google Gemini
  base_url: https://generativelanguage.googleapis.com/v1beta/openai
  api_key_env: GEMINI_API_KEY
  key_required: true
  dialect:
    wire: openai
    auth: bearer
    marking: {kind: none}
    dimensions_field: dimensions
  max_inputs: 100  # VERIFY: the compatible endpoint's per-request cap
  data_terms: >-
    Paid-tier keys only: free-tier content is used to improve Google's products
    (https://aistudio.google.com/docs/pricing).
  models:
    gemini-embedding-2:
      canonical_name: '@google/gemini-embedding-2'
      dimensions: 3072
      dimension_range: [128, 3072]
      max_input_tokens: 8192
      price: 0.20
      marking:
        kind: prefix
        name: gemini-embedding-2
        version: 1
        query: 'task: search result | query: {text}'
        document: 'title: none | text: {text}'

cohere:
  title: Cohere
  base_url: https://api.cohere.com/v2
  api_key_env: CO_API_KEY  # the variable Cohere's own SDK reads
  key_required: true
  dialect:
    wire: cohere_v2  # the native API: its OpenAI-compatible one drops input_type
    auth: bearer
    marking: {kind: field, field: input_type, query: search_query, document: search_document}
    dimensions_field: output_dimension
  max_inputs: 96
  data_terms: >-
    Uses API data for training unless the organisation opts out in the dashboard; trial
    keys are not for production (https://cohere.com/enterprise-data-commitments).
  models:
    embed-v5.0-pro:
      canonical_name: '@cohere/embed-v5.0-pro'
      compatibility_id: '@cohere/embed-v5.0-suite'
      dimensions: 2048
      allowed_dimensions: [256, 512, 768, 1024, 1536, 2048]
      max_input_tokens: 128000
    embed-v5.0-fast:
      canonical_name: '@cohere/embed-v5.0-fast'
      compatibility_id: '@cohere/embed-v5.0-suite'
      dimensions: 2048
      allowed_dimensions: [256, 512, 768, 1024, 1536, 2048]
      max_input_tokens: 128000

mistral:
  title: Mistral AI
  base_url: https://api.mistral.ai/v1
  api_key_env: MISTRAL_API_KEY
  key_required: true
  dialect:
    wire: openai
    auth: bearer
    marking: {kind: none}
  # Mistral publishes no per-request limits for embeddings; these are Smart RAG's own
  # bounds.
  max_inputs: 2048
  max_request_tokens: 16000
  data_terms: >-
    Training on API data depends on the plan: Scale is opted out by default, others can
    opt out in the Admin Console (https://help.mistral.ai/en/articles/455207).
  models:
    mistral-embed:
      canonical_name: '@mistralai/mistral-embed'
      dimensions: 1024
      max_input_tokens: 8192
      price: 0.10

custom:
  title: Custom OpenAI-compatible endpoint
  base_url_env: SMARTRAG_EMBED_BASE_URL
  api_key_env: SMARTRAG_EMBED_API_KEY
  dialect:
    wire: openai
    auth: bearer
    marking: {kind: none}
  max_inputs: 2048
  data_terms: Whatever the endpoint's operator states.
  models: {}
