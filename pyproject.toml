[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 `license` expression + `license-files`
build-backend = "hatchling.build"

[project]
name = "smartrag"
dynamic = ["version"]
description = "A knowledge source any agent can use: search returns evidence with citations, the agent writes the answer."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "GOTOAI" }]
keywords = ["rag", "retrieval", "search", "agents", "mcp", "embeddings"]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "fastapi>=0.110",    # the query-plane Web API
    "uvicorn>=0.29",
    "typer>=0.12",       # the CLI: `smartrag run|serve|mcp` (console to come)
    "mcp>=2.3,<3",      # `smartrag mcp` (MCPServer is the 2.x API); required so it can always start
    "ruamel.yaml>=0.18", # per-kb config.yaml, edited in place (comments kept)
    "python-calamine>=0.8",  # Excel (xlsx, xlsm, xls, xlsb) for the TSV converter
    "charset-normalizer>=3.4",  # CSV encodings (cp932 exports)
    "pdfminer.six>=20240706",   # PDF text layers
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "numpy>=1.26",       # vector search (brute force over a memory-mapped matrix)
]

[project.urls]
Homepage = "https://github.com/gotoai/smartrag"
Repository = "https://github.com/gotoai/smartrag"
Issues = "https://github.com/gotoai/smartrag/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx2>=2",         # FastAPI's TestClient (Starlette deprecated plain httpx for it)
    "ruff>=0.5",
    "mypy>=1.10",
    "openpyxl>=3.1",     # writes the Excel fixtures in tests
]

[project.scripts]
smartrag = "smartrag.cli.main:main"

[tool.hatch.version]
path = "src/smartrag/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/smartrag"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI / typer declare parameters through calls in defaults; that is their idiom.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Header", "typer.Option",
    "typer.Argument",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
